name: AIBuilder
main: me.abdiskiosk.minecraftaibuilder.plugin.AIBuilderPlugin
version: ${version}
author: AbdisKiosk
description: Lets Claude Code build with WorldEdit over MCP.
depend: [WorldEdit]
softdepend: [FastAsyncWorldEdit]
commands:
  aibuilder:
    description: Shows AIBuilder status and connection details; "stats" shows what MCP calls cost in tokens; mark, marks, unmark and note point Claude at places and leave it notes.
    usage: /aibuilder [stats [reset] | mark <name> | unmark <name> | marks | note <text>]
    permission: aibuilder.admin
permissions:
  aibuilder.admin:
    default: op
