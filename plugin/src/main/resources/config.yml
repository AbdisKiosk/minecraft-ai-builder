# AIBuilder: MCP + REST bridge for Claude Code.
http:
  # Set to false when Claude Code reaches this server only through the web panel (relay below).
  enabled: true
  # Keep this on 127.0.0.1 unless you put the server behind something that adds TLS.
  bind: 127.0.0.1
  port: 8765
  # Generated on first start. Claude Code reads it from the AIBUILDER_TOKEN environment variable.
  token: ""

limits:
  # Blocks written per server tick with vanilla WorldEdit (FAWE does its own queueing).
  blocks-per-tick: 4000
  # Largest single operation, in blocks.
  max-volume-per-op: 2000000
  # Largest region read_region / render_region may read (64^3 = 262144).
  max-read-volume: 262144
  # How long a tool call waits for its job before returning "running".
  job-wait-seconds: 30

safety:
  # Empty = every world.
  allowed-worlds: []
  # Optional box edits must stay inside. Leave world empty to disable.
  build-zone:
    world: ""
    min: [0, 0, 0]
    max: [0, 0, 0]
  # Directories place_blueprint may read files from. Empty = any absolute path.
  blueprint-dirs: []

players:
  # Whether the tell tool may teleport the acting player to a build.
  allow-teleport: true

relay:
  # Web panel to connect out to, e.g. wss://panel.example.com (see docs/panel.md). The server then needs no open
  # port: Claude Code and scripts use https://panel.example.com/s/<server>. Empty = off.
  url: ""
  # Printed by "java -jar AIBuilderPanel.jar add-server <name>" on the panel host.
  token: ""

history:
  # Record a block diff of every edit, for the panel's history (before/after/changes pictures and revert).
  enabled: true
  # Edits touching more blocks than this are logged without a diff.
  max-volume: 2000000
  # Oldest entries are deleted past either limit.
  keep: 500
  max-mb: 200
  # Blocks read per tick for snapshots (vanilla WorldEdit); keeps big edits from lagging the server.
  reads-per-tick: 32768
  # Largest region the panel may render for one entry.
  max-render-volume: 1000000
