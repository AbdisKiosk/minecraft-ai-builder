# AIBuilder: lets Claude Code build with WorldEdit, through the web panel.
# The plugin opens no port. It connects out to the panel, and Claude Code and scripts use the panel's address.
relay:
  # The panel to connect out to, e.g. wss://panel.example.com (see docs/panel.md). Claude Code and scripts then
  # use https://panel.example.com/s/<server> with an access token made in the panel.
  url: ""
  # The AIBuilder.jar you download from the panel fills url and token in by itself on first start. To set them by
  # hand, take them from "Restarted, but it doesn't connect?" on the server's setup page.
  token: ""

limits:
  # Blocks written per server tick with vanilla WorldEdit (FAWE does its own queueing).
  blocks-per-tick: 4000
  # Largest single operation, in blocks.
  max-volume-per-op: 2000000
  # Largest region a read, check, render or light may cover. Reads are spread over ticks, 100000 blocks at a time.
  max-read-volume: 2000000
  # Heap that stays free for the server itself. A read or edit that would leave less is refused with a message
  # instead of risking an out-of-memory crash; every 16x16 chunk it has to load counts as 1.5 MB.
  min-free-memory-mb: 256
  # How long a tool call waits for its job before returning "running".
  job-wait-seconds: 30

safety:
  # Empty = every world.
  allowed-worlds: []
  # Optional box edits must stay inside. Leave world empty to disable.
  build-zone:
    world: ""
    min: [0, 0, 0]
    max: [0, 0, 0]
  # Directories place_blueprint may read files from. Empty = any absolute path.
  blueprint-dirs: []

players:
  # Whether the tell tool may teleport the acting player to a build.
  allow-teleport: true

history:
  # Record a block diff of every edit, for the panel's history (before/after/changes pictures and revert).
  enabled: true
  # Edits touching more blocks than this are logged without a diff.
  max-volume: 2000000
  # Oldest entries are deleted past either limit.
  keep: 500
  max-mb: 200
  # Blocks read per tick for snapshots (vanilla WorldEdit); keeps big edits from lagging the server.
  reads-per-tick: 32768
  # Largest region the panel may render for one entry.
  max-render-volume: 1000000

review:
  # Claude's edits go into a draft instead of the world. Someone approves it in the panel (or with
  # /aibuilder draft approve) before anything is placed; Claude's reads show the draft. Needs WorldEdit, not FAWE.
  enabled: false
  # Most changed blocks one draft may hold.
  max-volume: 1000000
  # Approved and rejected drafts kept for the panel.
  keep: 50

promote:
  # Largest region the panel may copy out of or into this server (a promote always becomes a draft first).
  max-volume: 2000000
