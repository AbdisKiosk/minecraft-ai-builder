name: AIBuilder
main: me.abdiskiosk.minecraftaibuilder.plugin.AIBuilderPlugin
version: ${version}
author: AbdisKiosk
description: Lets Claude Code build with WorldEdit over MCP.
depend: [WorldEdit]
softdepend: [FastAsyncWorldEdit]
commands:
  aibuilder:
    description: Shows AIBuilder status and connection details; "stats" shows what MCP calls cost in tokens; mark, marks, unmark and note point Claude at places and leave it notes; draft approves or rejects edits waiting for review.
    usage: /aibuilder [stats [reset] | mark <name> | unmark <name> | marks | note <text> | draft [approve|reject] [world] [force]]
    permission: aibuilder.admin
permissions:
  aibuilder.admin:
    default: op
  aibuilder.approve:
    description: See, approve and reject drafts with /aibuilder draft.
    default: op
