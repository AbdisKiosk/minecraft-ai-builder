plugins {
    id 'java'
    id 'com.gradleup.shadow' version '9.6.1' apply false
    id 'xyz.jpenilla.run-paper' version '3.0.2' apply false
    id 'xyz.wagyourtail.jvmdowngrader' version '2.0.1' apply false
}

allprojects {
    group = 'me.abdiskiosk'
    version = '0.1.0-SNAPSHOT'
}

subprojects {
    apply plugin: 'java'

    repositories {
        mavenCentral()
        maven { url = 'https://hub.spigotmc.org/nexus/content/repositories/snapshots/' }
        maven { url = 'https://oss.sonatype.org/content/repositories/snapshots/' }
        maven { url = 'https://repo.papermc.io/repository/maven-public/' }
        maven { url = 'https://maven.enginehub.org/repo/' }
    }

    java {
        toolchain { languageVersion = JavaLanguageVersion.of(21) }
    }

    // The source is Java 17. JvmDowngrader then rewrites each module's jar to Java 8 bytecode (downgradeJar), against
    // that module's own compile classpath, and :core bundles those jars into the plugin. Tests run the Java 17 classes.
    apply plugin: 'xyz.wagyourtail.jvmdowngrader'

    tasks.withType(JavaCompile).configureEach {
        options.release = 17
        options.encoding = 'UTF-8'
    }

    dependencies {
        testImplementation platform('org.junit:junit-bom:6.0.0')
        testImplementation 'org.junit.jupiter:junit-jupiter'
        testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    }

    test {
        useJUnitPlatform()
    }
}
