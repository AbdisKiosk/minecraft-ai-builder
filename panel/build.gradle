// The web panel: Minecraft servers connect out to it over a WebSocket (no open port on the server), and it proxies
// MCP/REST per server under /s/<id>/, shows live job progress and each server's edit history. Runs on its own host.
plugins {
    id 'application'
    id 'com.gradleup.shadow'
}

dependencies {
    implementation project(':common')
    implementation 'io.javalin:javalin:6.7.0'
    implementation 'org.slf4j:slf4j-simple:2.0.16'
    implementation 'com.google.code.gson:gson:2.11.0'
}

application {
    mainClass = 'me.abdiskiosk.minecraftaibuilder.panel.PanelApp'
}

tasks.named('run', JavaExec) {
    workingDir = layout.projectDirectory.dir('run').asFile
    doFirst { workingDir.mkdirs() }
    standardInput = System.in
}

shadowJar {
    archiveBaseName = 'AIBuilderPanel'
    archiveClassifier = ''
    mergeServiceFiles()
    exclude 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA'
}

tasks.named('build') { dependsOn shadowJar }
